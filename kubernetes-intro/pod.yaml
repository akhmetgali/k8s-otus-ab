apiVersion: v1
kind: Pod
metadata:
  name: web-server
  namespace: homework
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 8000
      volumeMounts:
        - name: shared
          mountPath: /homework
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      lifecycle:
        preStop:
          exec:
            command: ["/bin/sh", "-c", "rm -f /homework/index.html"]
      command:
        - /bin/sh
        - -c
        - |
          nginx -t && nginx -g 'daemon off;'
  initContainers:
    - name: init-container
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "<html><body><h1>Hello, Homework!</h1></body></html>" > /init/index.html
      volumeMounts:
        - name: shared
          mountPath: /init
  volumes:
    - name: shared
      emptyDir: {}
    - name: nginx-config
      configMap:
        name: nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: homework
data:
  default.conf: |
    server {
        listen 8000;
        server_name localhost;
        location / {
            root /homework;
            index index.html;
        }
    }
